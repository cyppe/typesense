name: ort-bundles

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ""
      target_scope:
        description: Limit the workflow to one ORT bundle lane or build both
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-amd64
          - linux-arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-targets:
    name: select-targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      enabled: ${{ steps.select.outputs.enabled }}
    steps:
      - name: Select target matrix
        id: select
        env:
          TARGET_SCOPE: ${{ inputs.target_scope }}
        run: |
          python3 - <<'PY'
          import json
          import os

          scope = os.environ["TARGET_SCOPE"]
          targets = [
              {
                  "artifact_name": "linux-amd64",
                  "runner": "ubuntu-24.04",
                  "target_arch": "amd64",
                  "docker_platform": "linux/amd64",
              },
              {
                  "artifact_name": "linux-arm64",
                  "runner": "ubuntu-24.04-arm",
                  "target_arch": "arm64",
                  "docker_platform": "linux/arm64",
              },
          ]

          selected = targets if scope == "all" else [t for t in targets if t["artifact_name"] == scope]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps({'include': selected})}\n")
              fh.write(f"enabled={'true' if selected else 'false'}\n")
          PY

  build-bundles:
    if: needs.select-targets.outputs.enabled == 'true'
    needs: select-targets
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    env:
      TYPESENSE_BAZEL_IMAGE: typesense/ci-bazel-cuda:ci
      TYPESENSE_BAZEL_DOCKERFILE: docker/ci-bazel-cuda.Dockerfile
      TYPESENSE_BAZEL_CACHE_DIR: ${{ github.workspace }}/.cache/bazel-docker
      TYPESENSE_BAZEL_REPO_ENV_CONLYOPTS: -std=gnu17
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', '.bazelrc', 'bazel/**', 'docker/ci-bazel-cuda.Dockerfile') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-${{ matrix.artifact_name }}-

      - name: Compute ORT bundle key
        id: bundle-key
        run: echo "bundle_key=$(scripts/release_ort_bundle.sh --print-key --target-arch "${{ matrix.target_arch }}")" >>"${GITHUB_OUTPUT}"

      - name: Build CI Bazel image
        run: |
          export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          scripts/bazel_in_docker.sh --build-image-only

      - name: Build and package ORT bundle
        run: |
          export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          export TYPESENSE_ORT_BUILD_JOBS="$(nproc)"
          scripts/release_ort_bundle.sh --build --target-arch "${{ matrix.target_arch }}" --version-label "${{ steps.bundle-key.outputs.bundle_key }}"

      - name: Upload ORT bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: typesense-ort-bundle-${{ steps.bundle-key.outputs.bundle_key }}-linux-${{ matrix.target_arch }}
          path: |
            ${{ github.workspace }}/artifacts/typesense-ort-bundle-${{ steps.bundle-key.outputs.bundle_key }}-linux-${{ matrix.target_arch }}.tar.gz
            ${{ github.workspace }}/artifacts/typesense-ort-bundle-${{ steps.bundle-key.outputs.bundle_key }}-linux-${{ matrix.target_arch }}.tar.gz.sha256.txt
            ${{ github.workspace }}/artifacts/typesense-ort-bundle-${{ steps.bundle-key.outputs.bundle_key }}-linux-${{ matrix.target_arch }}.json
          retention-days: 90

      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', '.bazelrc', 'bazel/**', 'docker/ci-bazel-cuda.Dockerfile') }}
