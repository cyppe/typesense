name: Benchmark Testing

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Report workflow SHA
        run: |
          echo "Workflow ref: ${{ github.ref }}"
          echo "Workflow SHA: ${{ github.sha }}"
          echo "Checked out SHA: $(git rev-parse HEAD)"

      - name: Select candidate and baseline test runs
        id: get-runs
        run: |
          CURRENT_BRANCH="${{ github.ref_name }}"
          CURRENT_SHA="${{ github.sha }}"

          echo "Current branch: $CURRENT_BRANCH"
          echo "Current workflow SHA: $CURRENT_SHA"

          echo "Fetching successful tests.yml runs from ${{ github.repository }}..."
          RUNS_INFO=$(gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/workflows/tests.yml/runs \
            -q ".workflow_runs[] | select(.conclusion == \"success\" and .head_branch == \"$CURRENT_BRANCH\") | {id: .id, sha: .head_sha}" \
            --paginate)

          if [ -z "$RUNS_INFO" ]; then
            echo "No successful tests.yml runs found on branch $CURRENT_BRANCH."
            exit 1
          fi

          echo "Successful runs on branch:"
          echo "$RUNS_INFO"

          CANDIDATE_RUN=$(printf '%s\n' "$RUNS_INFO" | jq -c "select(.sha == \"$CURRENT_SHA\")" | head -n 1)
          if [ -z "$CANDIDATE_RUN" ]; then
            echo "No successful tests.yml artifact exists yet for workflow SHA $CURRENT_SHA."
            echo "Wait for the push workflow on this SHA to finish green, then rerun benchmark-testing."
            exit 1
          fi

          BASELINE_RUN=$(printf '%s\n' "$RUNS_INFO" | jq -c "select(.sha != \"$CURRENT_SHA\")" | head -n 1)
          if [ -z "$BASELINE_RUN" ]; then
            echo "Need at least one earlier successful tests.yml run on branch $CURRENT_BRANCH to use as a baseline."
            exit 1
          fi

          CANDIDATE_ID=$(echo "$CANDIDATE_RUN" | jq -r '.id')
          CANDIDATE_SHA=$(echo "$CANDIDATE_RUN" | jq -r '.sha')
          BASELINE_ID=$(echo "$BASELINE_RUN" | jq -r '.id')
          BASELINE_SHA=$(echo "$BASELINE_RUN" | jq -r '.sha')

          echo "Selected candidate run ID: $CANDIDATE_ID"
          echo "Selected candidate SHA: $CANDIDATE_SHA"
          echo "Selected baseline run ID: $BASELINE_ID"
          echo "Selected baseline SHA: $BASELINE_SHA"

          echo "latest_run=$CANDIDATE_ID" >> $GITHUB_OUTPUT
          echo "previous_run=$BASELINE_ID" >> $GITHUB_OUTPUT
          echo "latest_sha=$CANDIDATE_SHA" >> $GITHUB_OUTPUT
          echo "previous_sha=$BASELINE_SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      # Download latest version binary
      - name: Download Latest Version Binary
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: tests.yml
          name: typesense-server
          path: ./current-binary
          run_id: ${{ steps.get-runs.outputs.latest_run }}
          workflow_conclusion: success

      # Download previous version binary
      - name: Download Previous Version Binary
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: tests.yml
          name: typesense-server
          path: ./base-binary
          run_id: ${{ steps.get-runs.outputs.previous_run }}
          workflow_conclusion: success

      # Make binaries executable
      - name: Make binaries executable
        run: |
          chmod +x ./current-binary/typesense-server
          chmod +x ./base-binary/typesense-server

      # Download previous benchmark data
      - name: Download previous benchmark data
        uses: dawidd6/action-download-artifact@v19
        with:
          name: benchmark-data
          workflow: benchmark-testing.yml
          path: ./benchmark/influxdb-data
          branch: ${{ github.ref_name }}
          search_artifacts: true
          workflow_conclusion: success
        continue-on-error: true

      # Prepare InfluxDB
      - name: Prepare data directory
        working-directory: benchmark
        run: |
          mkdir -p ./influxdb-data
          sudo chown -R 999:999 ./influxdb-data

      - name: Run Benchmark Comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENCHMARK_WORK_DIR: ${{ github.workspace }}/benchmark/benchmark-workdir
          TYPESENSE_REQUEST_TIMEOUT_MS: 300000
        run: |
          echo "Latest SHA: ${{ steps.get-runs.outputs.latest_sha }}"
          echo "Previous SHA: ${{ steps.get-runs.outputs.previous_sha }}"
          echo "Request timeout override: ${TYPESENSE_REQUEST_TIMEOUT_MS} ms"
          scripts/benchmark_vs_upstream.sh \
            --baseline-binary "${{ github.workspace }}/base-binary/typesense-server" \
            --baseline-label "${{ steps.get-runs.outputs.previous_sha }}" \
            --fork-binary "${{ github.workspace }}/current-binary/typesense-server" \
            --fork-label "${{ steps.get-runs.outputs.latest_sha }}" \
            --work-dir "${{ github.workspace }}/benchmark/benchmark-workdir" \
            --scope core \
            --duration 1m \
            --no-flush

      # Fix permissions and save data
      - name: Fix permissions for artifact upload
        if: always()
        working-directory: benchmark
        run: |
          sudo chown -R $USER:$USER ./influxdb-data
          sudo find ./influxdb-data -type d -exec chmod 755 {} \;
          sudo find ./influxdb-data -type f -exec chmod 644 {} \;

      - name: Upload benchmark data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-data
          path: ./benchmark/influxdb-data
          if-no-files-found: warn
          compression-level: 6
          overwrite: false

      - name: Upload reproduction guide
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reproduction-guide
          path: benchmark/reproduction-guide.md
          if-no-files-found: ignore

      - name: Stop containers
        if: always()
        working-directory: benchmark
        run: docker compose down
