name: release-binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ""
      version_label:
        description: Version label used in artifact file names
        required: false
        default: snapshot
      upload_artifacts:
        description: Upload build artifacts
        required: false
        default: true
        type: boolean
      build_linux_packages:
        description: Build DEB and RPM artifacts for Linux lanes
        required: false
        default: true
        type: boolean
      target_scope:
        description: Limit the workflow to a platform group or single lane
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - linux-amd64
          - linux-arm64
          - linux-arm64-lg-page16
          - darwin
          - darwin-amd64
          - darwin-arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select_targets:
    name: select-targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select target matrix
        id: select
        env:
          TARGET_SCOPE: ${{ inputs.target_scope }}
        run: |
          python3 - <<'PY'
          import json
          import os

          targets = [
              {
                  "artifact_name": "linux-amd64",
                  "runner": "ubuntu-24.04",
                  "target_os": "linux",
                  "target_arch": "amd64",
                  "docker_platform": "linux/amd64",
                  "release_suffix": "",
                  "rpm_arch": "x86_64",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": True,
              },
              {
                  "artifact_name": "linux-arm64",
                  "runner": "ubuntu-24.04-arm",
                  "target_os": "linux",
                  "target_arch": "arm64",
                  "docker_platform": "linux/arm64",
                  "release_suffix": "",
                  "rpm_arch": "aarch64",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": True,
              },
              {
                  "artifact_name": "linux-arm64-lg-page16",
                  "runner": "ubuntu-24.04-arm",
                  "target_os": "linux",
                  "target_arch": "arm64",
                  "docker_platform": "linux/arm64",
                  "release_suffix": "-lg-page16",
                  "rpm_arch": "aarch64",
                  "enable_jemalloc_lg_page16": True,
                  "uses_docker_bazel": True,
              },
              {
                  "artifact_name": "darwin-arm64",
                  "runner": "macos-14",
                  "target_os": "darwin",
                  "target_arch": "arm64",
                  "docker_platform": "",
                  "release_suffix": "",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": False,
                  "openssl_prefix": "/opt/homebrew/opt/openssl@3",
                  "icu_prefix": "/opt/homebrew/opt/icu4c",
              },
              {
                  "artifact_name": "darwin-amd64",
                  "runner": "macos-15-intel",
                  "target_os": "darwin",
                  "target_arch": "amd64",
                  "docker_platform": "",
                  "release_suffix": "",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": False,
                  "openssl_prefix": "/usr/local/opt/openssl@3",
                  "icu_prefix": "/usr/local/opt/icu4c",
              },
          ]

          scope = os.environ["TARGET_SCOPE"] or "all"
          selected = [
              target for target in targets
              if scope in ("all", target["target_os"], target["artifact_name"])
          ]
          if not selected:
              raise SystemExit(f"No release targets matched target_scope={scope!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps({'include': selected})}\n")
          PY

  core-binaries:
    needs: select_targets
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select_targets.outputs.matrix) }}
    env:
      TYPESENSE_BAZEL_IMAGE: typesense/ci-bazel-cuda:ci
      TYPESENSE_BAZEL_DOCKERFILE: docker/ci-bazel-cuda.Dockerfile
      TYPESENSE_BAZEL_CACHE_DIR: ${{ github.workspace }}/.cache/bazel-docker
      TYPESENSE_BAZEL_REPO_ENV_CONLYOPTS: -std=gnu17
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Build CI Bazel image
        if: matrix.uses_docker_bazel
        run: |
          if [ -n "${{ matrix.docker_platform }}" ]; then
            export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          fi
          scripts/bazel_in_docker.sh --build-image-only

      - name: Install macOS build dependencies
        if: ${{ !matrix.uses_docker_bazel }}
        run: brew install bazelisk coreutils gnu-sed snappy zlib openssl@3 curl icu4c

      - name: Build Typesense server in Docker
        if: matrix.uses_docker_bazel
        run: |
          if [ -n "${{ matrix.docker_platform }}" ]; then
            export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          fi
          args=(build //:typesense-server)
          args+=(--define=use_cuda=on)
          if [ "${{ matrix.enable_jemalloc_lg_page16 }}" = "true" ]; then
            args+=(--define=enable_jemalloc_lg_page16=1)
          fi
          scripts/bazel_in_docker.sh "${args[@]}"

      - name: Build Typesense server on macOS
        if: ${{ !matrix.uses_docker_bazel }}
        run: |
          BREW_PREFIX="$(brew --prefix)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          ICU_PREFIX="$(brew --prefix icu4c 2>/dev/null || brew --prefix icu4c@78)"
          ZLIB_PREFIX="$(brew --prefix zlib)"
          GNU_SED_PREFIX="$(brew --prefix gnu-sed)"
          export PATH="${GNU_SED_PREFIX}/libexec/gnubin:${BREW_PREFIX}/bin:${OPENSSL_PREFIX}/bin:${ICU_PREFIX}/bin:$PATH"
          export LDFLAGS="-L${OPENSSL_PREFIX}/lib -L${ICU_PREFIX}/lib -L${ZLIB_PREFIX}/lib"
          export CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${ICU_PREFIX}/include -I${ZLIB_PREFIX}/include"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig:${ICU_PREFIX}/lib/pkgconfig:${ZLIB_PREFIX}/lib/pkgconfig"
          if ! bazelisk build //:typesense-server --verbose_failures --experimental_ui_max_stdouterr_bytes=20000000; then
            python -c "from pathlib import Path; [print('===== %s =====\\n%s' % (path, path.read_text(errors='replace'))) for path in sorted(Path('bazel-out').glob('**/*openssl*.log'))]"
            exit 1
          fi

      - name: Prepare darwin artifact staging
        if: matrix.target_os == 'darwin'
        run: |
          mkdir -p "${{ github.workspace }}/release/${{ matrix.artifact_name }}"
          cp bazel-bin/typesense-server "${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server"
          chmod +x "${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server"

      - name: Assemble Linux release artifacts
        if: matrix.target_os == 'linux'
        run: |
          args=(--with-cuda --version-label "${{ inputs.version_label }}" --target-arch "${{ matrix.target_arch }}")
          if [ "${{ matrix.enable_jemalloc_lg_page16 }}" = "true" ]; then
            args+=(--jemalloc-lg-page16)
          fi
          if [ "${{ inputs.build_linux_packages }}" != "true" ]; then
            args+=(--skip-packages)
          fi
          bash scripts/release_linux_artifacts.sh "${args[@]}"

      - name: Write binary checksum manifest
        if: matrix.target_os == 'darwin'
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          release_dir = Path(r"${{ github.workspace }}/release/${{ matrix.artifact_name }}")
          binary = release_dir / "typesense-server"
          digest = hashlib.md5(binary.read_bytes()).hexdigest()
          (release_dir / "typesense-server.md5.txt").write_text(digest + "\n")
          PY

      - name: Smoke-test staged binary
        if: matrix.target_os == 'darwin'
        run: |
          HELP_OUTPUT="${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server-help.txt"
          set +e
          "${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server" --help >"${HELP_OUTPUT}" 2>&1
          STATUS=$?
          set -e
          cat "${HELP_OUTPUT}"
          if [ "${STATUS}" -ne 0 ] && [ "${STATUS}" -ne 1 ]; then
            exit "${STATUS}"
          fi
          grep -Eq '^usage:|^Command line usage:' "${HELP_OUTPUT}"

      - name: Package tarball
        if: matrix.target_os == 'darwin'
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          tar -czf "${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz" -C "${{ github.workspace }}/release/${{ matrix.artifact_name }}" .
          python - <<'PY'
          import hashlib
          from pathlib import Path

          archive = Path(r"${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + ".sha256.txt").write_text(f"{digest}  {archive.name}\n")
          PY

      - name: Verify packaged artifact contents
        if: matrix.target_os == 'darwin'
        run: |
          python - <<'PY'
          import hashlib
          import tarfile
          from pathlib import Path

          archive = Path(r"${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz")
          with tarfile.open(archive, "r:gz") as tf:
              members = {member.name.lstrip("./"): member for member in tf.getmembers() if member.isfile()}
              if "typesense-server" not in members:
                  raise SystemExit("typesense-server missing from packaged artifact")
              if "typesense-server.md5.txt" not in members:
                  raise SystemExit("typesense-server.md5.txt missing from packaged artifact")
              binary_bytes = tf.extractfile(members["typesense-server"]).read()
              md5_bytes = tf.extractfile(members["typesense-server.md5.txt"]).read().decode().strip()
              digest = hashlib.md5(binary_bytes).hexdigest()
              if digest != md5_bytes:
                  raise SystemExit(f"binary md5 mismatch: expected {md5_bytes}, got {digest}")
          PY

      - name: Upload platform artifact
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}
          path: |
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz.sha256.txt
          retention-days: 14

      - name: Upload Linux debug symbols
        if: matrix.target_os == 'linux' && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}-debug
          path: |
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.debug.tar.gz
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.debug.tar.gz.sha256.txt
          retention-days: 14

      - name: Upload Linux package artifacts
        if: matrix.target_os == 'linux' && inputs.build_linux_packages && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}-packages
          path: |
            ${{ github.workspace }}/artifacts/packages/typesense-server-${{ inputs.version_label }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.deb
            ${{ github.workspace }}/artifacts/packages/typesense-server-*.${{ matrix.rpm_arch }}.rpm
          retention-days: 14

# Notes:
# - This is the manual workflow for core binary artifacts only.
# - It follows GitHub Actions best practices for native multi-platform builds: matrix fan-out, named artifacts, and separation of artifact build from any future publishing workflow.
# - Linux server lanes build the regular typesense-server artifact with CUDA-aware ONNX Runtime support; publish the optional provider sidecars separately via release-gpu-deps.yml.
# - Linux release tarballs/packages now ship the stripped runtime binary plus a separate `.debug` tarball sidecar that keeps split debug info keyed by the same BuildID.
# - Linux lanes now use `scripts/release_linux_artifacts.sh` so local replay and workflow assembly stay container-backed and share one canonical artifact path.
# - Darwin lanes intentionally ship the current unstripped `typesense-server` tarball with embedded DWARF and no `.dSYM` sidecar; revisit only when there is a concrete size/symbolication need plus a macOS-native validation lane.
# - Windows support in upstream docs is via WSL, not a native Windows server binary, so no native Windows artifact is produced here.
