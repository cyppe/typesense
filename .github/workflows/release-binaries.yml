name: release-binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ""
      version_label:
        description: Version label used in artifact file names
        required: false
        default: snapshot
      upload_artifacts:
        description: Upload build artifacts
        required: false
        default: true
        type: boolean
      build_server_artifacts:
        description: Build the regular typesense-server release artifacts
        required: false
        default: true
        type: boolean
      build_gpu_deps:
        description: Build the optional Linux typesense-gpu-deps artifacts
        required: false
        default: true
        type: boolean
      build_linux_packages:
        description: Build DEB and RPM artifacts for Linux lanes
        required: false
        default: true
        type: boolean
      push_docker_images:
        description: Push Linux runtime Docker images to Docker Hub after successful Linux artifact builds
        required: false
        default: false
        type: boolean
      target_scope:
        description: Limit the workflow to a platform group or single lane
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - linux-amd64
          - linux-arm64
          - linux-arm64-lg-page16
          - darwin
          - darwin-amd64
          - darwin-arm64
      use_prebuilt_ort_bundle:
        description: Auto-discover and reuse the latest matching successful same-branch ORT bundle
        required: false
        default: true
        type: boolean
      ort_bundle_run_id:
        description: Optional explicit ort-bundles.yml workflow run ID override (leave blank to auto-discover when enabled)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  select_targets:
    name: select-targets
    runs-on: ubuntu-24.04
    outputs:
      core_matrix: ${{ steps.select.outputs.core_matrix }}
      core_enabled: ${{ steps.select.outputs.core_enabled }}
      gpu_matrix: ${{ steps.select.outputs.gpu_matrix }}
      gpu_enabled: ${{ steps.select.outputs.gpu_enabled }}
    steps:
      - name: Select target matrix
        id: select
        env:
          TARGET_SCOPE: ${{ inputs.target_scope }}
          BUILD_SERVER_ARTIFACTS: ${{ inputs.build_server_artifacts }}
          BUILD_GPU_DEPS: ${{ inputs.build_gpu_deps }}
        run: |
          python3 - <<'PY'
          import json
          import os

          core_targets = [
              {
                  "artifact_name": "linux-amd64",
                  "runner": "ubuntu-24.04",
                  "target_os": "linux",
                  "target_arch": "amd64",
                  "docker_platform": "linux/amd64",
                  "release_suffix": "",
                  "rpm_arch": "x86_64",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": True,
              },
              {
                  "artifact_name": "linux-arm64",
                  "runner": "ubuntu-24.04-arm",
                  "target_os": "linux",
                  "target_arch": "arm64",
                  "docker_platform": "linux/arm64",
                  "release_suffix": "",
                  "rpm_arch": "aarch64",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": True,
              },
              {
                  "artifact_name": "linux-arm64-lg-page16",
                  "runner": "ubuntu-24.04-arm",
                  "target_os": "linux",
                  "target_arch": "arm64",
                  "docker_platform": "linux/arm64",
                  "release_suffix": "-lg-page16",
                  "rpm_arch": "aarch64",
                  "enable_jemalloc_lg_page16": True,
                  "uses_docker_bazel": True,
              },
              {
                  "artifact_name": "darwin-arm64",
                  "runner": "macos-14",
                  "target_os": "darwin",
                  "target_arch": "arm64",
                  "docker_platform": "",
                  "release_suffix": "",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": False,
                  "openssl_prefix": "/opt/homebrew/opt/openssl@3",
                  "icu_prefix": "/opt/homebrew/opt/icu4c",
              },
              {
                  "artifact_name": "darwin-amd64",
                  "runner": "macos-15-intel",
                  "target_os": "darwin",
                  "target_arch": "amd64",
                  "docker_platform": "",
                  "release_suffix": "",
                  "enable_jemalloc_lg_page16": False,
                  "uses_docker_bazel": False,
                  "openssl_prefix": "/usr/local/opt/openssl@3",
                  "icu_prefix": "/usr/local/opt/icu4c",
              },
          ]

          gpu_targets = [
              {
                  "artifact_name": "linux-amd64",
                  "runner": "ubuntu-24.04",
                  "target_arch": "amd64",
                  "docker_platform": "linux/amd64",
                  "rpm_arch": "x86_64",
                  "emit_lg_page16_alias": False,
              },
              {
                  "artifact_name": "linux-arm64",
                  "runner": "ubuntu-24.04-arm",
                  "target_arch": "arm64",
                  "docker_platform": "linux/arm64",
                  "rpm_arch": "aarch64",
                  "emit_lg_page16_alias": True,
              },
          ]

          scope = os.environ["TARGET_SCOPE"] or "all"
          build_server_artifacts = os.environ["BUILD_SERVER_ARTIFACTS"].lower() == "true"
          build_gpu_deps = os.environ["BUILD_GPU_DEPS"].lower() == "true"

          selected_core = [
              target for target in core_targets
              if scope in ("all", target["target_os"], target["artifact_name"])
          ]

          selected_gpu = []
          for target in gpu_targets:
              if scope in ("all", "linux", target["artifact_name"]):
                  selected_gpu.append(target)
                  continue
              if scope == "linux-arm64-lg-page16" and target["target_arch"] == "arm64":
                  selected_gpu.append(target)

          if build_server_artifacts and not selected_core:
              raise SystemExit(f"No core release targets matched target_scope={scope!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"core_matrix={json.dumps({'include': selected_core if build_server_artifacts else []})}\n")
              fh.write(f"core_enabled={'true' if build_server_artifacts and selected_core else 'false'}\n")
              fh.write(f"gpu_matrix={json.dumps({'include': selected_gpu if build_gpu_deps else []})}\n")
              fh.write(f"gpu_enabled={'true' if build_gpu_deps and selected_gpu else 'false'}\n")
          PY

  core-binaries:
    if: needs.select_targets.outputs.core_enabled == 'true'
    needs: select_targets
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select_targets.outputs.core_matrix) }}
    env:
      TYPESENSE_BAZEL_IMAGE: typesense/ci-bazel-cuda:ci
      TYPESENSE_BAZEL_DOCKERFILE: docker/ci-bazel-cuda.Dockerfile
      TYPESENSE_BAZEL_CACHE_DIR: ${{ github.workspace }}/.cache/bazel-docker
      TYPESENSE_BAZEL_REPO_ENV_CONLYOPTS: -std=gnu17
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Restore Bazel cache (Docker)
        if: matrix.uses_docker_bazel
        id: bazel-cache-docker
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-docker-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**', 'docker/ci-bazel-cuda.Dockerfile') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-docker-${{ matrix.artifact_name }}-

      - name: Restore Bazel cache (Host)
        if: ${{ !matrix.uses_docker_bazel }}
        id: bazel-cache-host
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/typesense-bazel-host/disk-cache
            ${{ runner.temp }}/typesense-bazel-host/repository-cache
            ${{ runner.temp }}/typesense-bazel-host/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-host-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-host-${{ matrix.artifact_name }}-

      - name: Compute ORT bundle key
        if: matrix.target_os == 'linux' && inputs.use_prebuilt_ort_bundle
        id: ort-bundle-key
        run: echo "bundle_key=$(scripts/release_ort_bundle.sh --print-key --target-arch "${{ matrix.target_arch }}")" >>"${GITHUB_OUTPUT}"

      - name: Resolve prebuilt ORT bundle run
        if: matrix.target_os == 'linux' && inputs.use_prebuilt_ort_bundle
        id: ort-bundle-run
        run: |
          set -euo pipefail

          artifact_name="typesense-ort-bundle-${{ steps.ort-bundle-key.outputs.bundle_key }}-linux-${{ matrix.target_arch }}"
          run_id="${{ inputs.ort_bundle_run_id }}"

          if [ -n "${run_id}" ]; then
            found_name="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
              -q '.artifacts[] | select(.name == "'"${artifact_name}"'") | .name' | head -n 1 || true)"
            if [ "${found_name}" != "${artifact_name}" ]; then
              echo "Requested ORT bundle run ${run_id} does not contain ${artifact_name}" >&2
              exit 1
            fi
          else
            while IFS= read -r candidate_run_id; do
              [ -n "${candidate_run_id}" ] || continue
              found_name="$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/actions/runs/${candidate_run_id}/artifacts" \
                -q '.artifacts[] | select(.name == "'"${artifact_name}"'") | .name' | head -n 1 || true)"
              if [ "${found_name}" = "${artifact_name}" ]; then
                run_id="${candidate_run_id}"
                break
              fi
            done < <(
              gh api -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/actions/workflows/ort-bundles.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=20" \
                -q '.workflow_runs[] | select(.conclusion == "success") | .id'
            )
          fi

          echo "artifact_name=${artifact_name}" >>"$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >>"$GITHUB_OUTPUT"

          if [ -n "${run_id}" ]; then
            echo "Using prebuilt ORT bundle run ${run_id} for ${artifact_name}"
          else
            echo "No matching ORT bundle found for ${artifact_name}; falling back to source build."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download prebuilt ORT bundle
        if: matrix.target_os == 'linux' && steps.ort-bundle-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.ort-bundle-run.outputs.artifact_name }}
          path: ${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ort-bundle-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract prebuilt ORT bundle
        if: matrix.target_os == 'linux' && steps.ort-bundle-run.outputs.run_id != ''
        run: |
          cd "${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}"
          sha256sum -c "${{ steps.ort-bundle-run.outputs.artifact_name }}.tar.gz.sha256.txt"
          mkdir -p bundle
          tar -xzf "${{ steps.ort-bundle-run.outputs.artifact_name }}.tar.gz" -C bundle

      - name: Build CI Bazel image
        if: matrix.uses_docker_bazel
        run: |
          if [ -n "${{ matrix.docker_platform }}" ]; then
            export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          fi
          scripts/bazel_in_docker.sh --build-image-only

      - name: Install macOS build dependencies
        if: ${{ !matrix.uses_docker_bazel }}
        run: brew install bazelisk coreutils gnu-sed snappy zlib openssl@3 curl icu4c

      - name: Build Typesense server in Docker
        if: matrix.uses_docker_bazel
        run: |
          if [ -n "${{ matrix.docker_platform }}" ]; then
            export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          fi
          export TYPESENSE_ORT_BUILD_JOBS="$(nproc)"
          args=(build //:typesense-server)
          args+=(--define=use_cuda=on)
          if [ "${{ matrix.enable_jemalloc_lg_page16 }}" = "true" ]; then
            args+=(--define=enable_jemalloc_lg_page16=1)
          fi
          if [ -d "${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}/bundle/lib" ]; then
            args+=(--repo_env=TYPESENSE_ORT_PREBUILT_BUNDLE_DIR=/work/ort-bundle/${{ matrix.target_arch }}/bundle)
          fi
          scripts/bazel_in_docker.sh "${args[@]}"

      - name: Upload Linux GPU provider build inputs
        if: matrix.target_os == 'linux' && (matrix.release_suffix == '' || (inputs.target_scope == 'linux-arm64-lg-page16' && matrix.artifact_name == 'linux-arm64-lg-page16'))
        uses: actions/upload-artifact@v7
        with:
          name: gpu-provider-build-inputs-linux-${{ matrix.target_arch }}
          path: |
            ${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}/bundle/lib/libonnxruntime_providers_shared.so
            ${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}/bundle/lib/libonnxruntime_providers_cuda.so
            ${{ github.workspace }}/bazel-bin/external/+new_git_repository+onnx_runtime/onnxruntime_static_one_protobuf/lib/libonnxruntime_providers_shared.so
            ${{ github.workspace }}/bazel-bin/external/+new_git_repository+onnx_runtime/onnxruntime_static_one_protobuf/lib/libonnxruntime_providers_cuda.so
          if-no-files-found: error
          retention-days: 1

      - name: Build Typesense server on macOS
        if: ${{ !matrix.uses_docker_bazel }}
        run: |
          BREW_PREFIX="$(brew --prefix)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          ICU_PREFIX="$(brew --prefix icu4c 2>/dev/null || brew --prefix icu4c@78)"
          ZLIB_PREFIX="$(brew --prefix zlib)"
          GNU_SED_PREFIX="$(brew --prefix gnu-sed)"
          HOST_CACHE_DIR="${RUNNER_TEMP}/typesense-bazel-host"
          DISK_CACHE="${HOST_CACHE_DIR}/disk-cache"
          REPOSITORY_CACHE="${HOST_CACHE_DIR}/repository-cache"
          mkdir -p "${DISK_CACHE}" "${REPOSITORY_CACHE}" "${HOST_CACHE_DIR}/bazelisk"
          export BAZELISK_HOME="${HOST_CACHE_DIR}/bazelisk"
          export PATH="${GNU_SED_PREFIX}/libexec/gnubin:${BREW_PREFIX}/bin:${OPENSSL_PREFIX}/bin:${ICU_PREFIX}/bin:$PATH"
          export LDFLAGS="-L${OPENSSL_PREFIX}/lib -L${ICU_PREFIX}/lib -L${ZLIB_PREFIX}/lib"
          export CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${ICU_PREFIX}/include -I${ZLIB_PREFIX}/include"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig:${ICU_PREFIX}/lib/pkgconfig:${ZLIB_PREFIX}/lib/pkgconfig"
          if ! bazelisk build \
            --disk_cache="${DISK_CACHE}" \
            --repository_cache="${REPOSITORY_CACHE}" \
            //:typesense-server \
            --verbose_failures \
            --experimental_ui_max_stdouterr_bytes=20000000; then
            python -c "from pathlib import Path; [print('===== %s =====\\n%s' % (path, path.read_text(errors='replace'))) for path in sorted(Path('bazel-out').glob('**/*openssl*.log'))]"
            exit 1
          fi

      - name: Prepare darwin artifact staging
        if: matrix.target_os == 'darwin'
        run: |
          mkdir -p "${{ github.workspace }}/release/${{ matrix.artifact_name }}"
          cp bazel-bin/typesense-server "${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server"
          chmod +x "${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server"

      - name: Assemble Linux release artifacts
        if: matrix.target_os == 'linux'
        run: |
          args=(--with-cuda --version-label "${{ inputs.version_label }}" --target-arch "${{ matrix.target_arch }}")
          if [ "${{ matrix.enable_jemalloc_lg_page16 }}" = "true" ]; then
            args+=(--jemalloc-lg-page16)
          fi
          if [ "${{ inputs.build_linux_packages }}" != "true" ]; then
            args+=(--skip-packages)
          fi
          if [ -d "${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}/bundle/lib" ]; then
            export TYPESENSE_ORT_PREBUILT_BUNDLE_DIR="${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}/bundle"
          fi
          bash scripts/release_linux_artifacts.sh "${args[@]}"

      - name: Write binary checksum manifest
        if: matrix.target_os == 'darwin'
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          release_dir = Path(r"${{ github.workspace }}/release/${{ matrix.artifact_name }}")
          binary = release_dir / "typesense-server"
          digest = hashlib.md5(binary.read_bytes()).hexdigest()
          (release_dir / "typesense-server.md5.txt").write_text(digest + "\n")
          PY

      - name: Smoke-test staged binary
        if: matrix.target_os == 'darwin'
        run: |
          HELP_OUTPUT="${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server-help.txt"
          set +e
          "${{ github.workspace }}/release/${{ matrix.artifact_name }}/typesense-server" --help >"${HELP_OUTPUT}" 2>&1
          STATUS=$?
          set -e
          cat "${HELP_OUTPUT}"
          if [ "${STATUS}" -ne 0 ] && [ "${STATUS}" -ne 1 ]; then
            exit "${STATUS}"
          fi
          grep -Eq '^usage:|^Command line usage:' "${HELP_OUTPUT}"

      - name: Package tarball
        if: matrix.target_os == 'darwin'
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          tar -czf "${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz" -C "${{ github.workspace }}/release/${{ matrix.artifact_name }}" .
          python - <<'PY'
          import hashlib
          from pathlib import Path

          archive = Path(r"${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + ".sha256.txt").write_text(f"{digest}  {archive.name}\n")
          PY

      - name: Verify packaged artifact contents
        if: matrix.target_os == 'darwin'
        run: |
          python - <<'PY'
          import hashlib
          import tarfile
          from pathlib import Path

          archive = Path(r"${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz")
          with tarfile.open(archive, "r:gz") as tf:
              members = {member.name.lstrip("./"): member for member in tf.getmembers() if member.isfile()}
              if "typesense-server" not in members:
                  raise SystemExit("typesense-server missing from packaged artifact")
              if "typesense-server.md5.txt" not in members:
                  raise SystemExit("typesense-server.md5.txt missing from packaged artifact")
              binary_bytes = tf.extractfile(members["typesense-server"]).read()
              md5_bytes = tf.extractfile(members["typesense-server.md5.txt"]).read().decode().strip()
              digest = hashlib.md5(binary_bytes).hexdigest()
              if digest != md5_bytes:
                  raise SystemExit(f"binary md5 mismatch: expected {md5_bytes}, got {digest}")
          PY

      - name: Upload platform artifact
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}
          path: |
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.tar.gz.sha256.txt
          retention-days: 14

      - name: Upload Linux debug symbols
        if: matrix.target_os == 'linux' && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}-debug
          path: |
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.debug.tar.gz
            ${{ github.workspace }}/artifacts/typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.debug.tar.gz.sha256.txt
          retention-days: 14

      - name: Upload Linux package artifacts
        if: matrix.target_os == 'linux' && inputs.build_linux_packages && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-server-${{ inputs.version_label }}-${{ matrix.target_os }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}-packages
          path: |
            ${{ github.workspace }}/artifacts/packages/typesense-server-${{ inputs.version_label }}-${{ matrix.target_arch }}${{ matrix.release_suffix }}.deb
            ${{ github.workspace }}/artifacts/packages/typesense-server-*.${{ matrix.rpm_arch }}.rpm
          retention-days: 14

      - name: Save Bazel cache (Docker)
        if: always() && matrix.uses_docker_bazel && steps.bazel-cache-docker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-docker-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**', 'docker/ci-bazel-cuda.Dockerfile') }}

      - name: Save Bazel cache (Host)
        if: always() && (!matrix.uses_docker_bazel) && steps.bazel-cache-host.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/typesense-bazel-host/disk-cache
            ${{ runner.temp }}/typesense-bazel-host/repository-cache
            ${{ runner.temp }}/typesense-bazel-host/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-host-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**') }}

      - name: Report Bazel cache size
        if: always()
        run: |
          du -sh ${{ github.workspace }}/.cache/bazel-docker/* 2>/dev/null || true
          du -sh "${RUNNER_TEMP}/typesense-bazel-host"/* 2>/dev/null || true

  gpu-deps:
    if: always() && needs.select_targets.outputs.gpu_enabled == 'true' && (needs.core-binaries.result == 'success' || needs.core-binaries.result == 'skipped')
    needs:
      - select_targets
      - core-binaries
    name: gpu-${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select_targets.outputs.gpu_matrix) }}
    env:
      TYPESENSE_BAZEL_IMAGE: typesense/ci-bazel-cuda:ci
      TYPESENSE_BAZEL_DOCKERFILE: docker/ci-bazel-cuda.Dockerfile
      TYPESENSE_BAZEL_CACHE_DIR: ${{ github.workspace }}/.cache/bazel-docker
      TYPESENSE_BAZEL_REPO_ENV_CONLYOPTS: -std=gnu17
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Restore Bazel cache
        if: needs.core-binaries.result == 'skipped'
        id: bazel-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-docker-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**', 'docker/ci-bazel-cuda.Dockerfile') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-docker-${{ matrix.artifact_name }}-

      - name: Compute ORT bundle key
        if: inputs.use_prebuilt_ort_bundle
        id: ort-bundle-key
        run: echo "bundle_key=$(scripts/release_ort_bundle.sh --print-key --target-arch "${{ matrix.target_arch }}")" >>"${GITHUB_OUTPUT}"

      - name: Resolve prebuilt ORT bundle run
        if: inputs.use_prebuilt_ort_bundle
        id: ort-bundle-run
        run: |
          set -euo pipefail

          artifact_name="typesense-ort-bundle-${{ steps.ort-bundle-key.outputs.bundle_key }}-linux-${{ matrix.target_arch }}"
          run_id="${{ inputs.ort_bundle_run_id }}"

          if [ -n "${run_id}" ]; then
            found_name="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
              -q '.artifacts[] | select(.name == "'"${artifact_name}"'") | .name' | head -n 1 || true)"
            if [ "${found_name}" != "${artifact_name}" ]; then
              echo "Requested ORT bundle run ${run_id} does not contain ${artifact_name}" >&2
              exit 1
            fi
          else
            while IFS= read -r candidate_run_id; do
              [ -n "${candidate_run_id}" ] || continue
              found_name="$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/actions/runs/${candidate_run_id}/artifacts" \
                -q '.artifacts[] | select(.name == "'"${artifact_name}"'") | .name' | head -n 1 || true)"
              if [ "${found_name}" = "${artifact_name}" ]; then
                run_id="${candidate_run_id}"
                break
              fi
            done < <(
              gh api -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/actions/workflows/ort-bundles.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=20" \
                -q '.workflow_runs[] | select(.conclusion == "success") | .id'
            )
          fi

          echo "artifact_name=${artifact_name}" >>"$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >>"$GITHUB_OUTPUT"

          if [ -n "${run_id}" ]; then
            echo "Using prebuilt ORT bundle run ${run_id} for ${artifact_name}"
          else
            echo "No matching ORT bundle found for ${artifact_name}; falling back to source build."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download prebuilt ORT bundle
        if: steps.ort-bundle-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.ort-bundle-run.outputs.artifact_name }}
          path: ${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ort-bundle-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract prebuilt ORT bundle
        if: steps.ort-bundle-run.outputs.run_id != ''
        run: |
          cd "${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}"
          sha256sum -c "${{ steps.ort-bundle-run.outputs.artifact_name }}.tar.gz.sha256.txt"
          mkdir -p bundle
          tar -xzf "${{ steps.ort-bundle-run.outputs.artifact_name }}.tar.gz" -C bundle

      - name: Build CI Bazel image
        run: |
          export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          scripts/bazel_in_docker.sh --build-image-only

      - name: Download prebuilt GPU provider inputs
        if: needs.core-binaries.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: gpu-provider-build-inputs-linux-${{ matrix.target_arch }}
          path: ${{ github.workspace }}/bazel-bin/external/+new_git_repository+onnx_runtime/onnxruntime_static_one_protobuf/lib

      - name: Build GPU deps artifacts
        run: |
          args=(--version-label "${{ inputs.version_label }}" --target-arch "${{ matrix.target_arch }}")
          if [ "${{ needs.core-binaries.result }}" = "skipped" ]; then
            export TYPESENSE_ORT_BUILD_JOBS="$(nproc)"
            args=(--build "${args[@]}")
          fi
          if [ "${{ matrix.emit_lg_page16_alias }}" = "true" ]; then
            args+=(--emit-lg-page16-alias)
          fi
          if [ "${{ inputs.build_linux_packages }}" != "true" ]; then
            args+=(--skip-packages)
          fi
          export TYPESENSE_DOCKER_PLATFORM="${{ matrix.docker_platform }}"
          if [ -d "${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}/bundle/lib" ]; then
            export TYPESENSE_ORT_PREBUILT_BUNDLE_DIR="${{ github.workspace }}/ort-bundle/${{ matrix.target_arch }}/bundle"
          fi
          bash scripts/release_linux_gpu_deps.sh "${args[@]}"

      - name: Upload primary GPU deps artifact
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-gpu-deps-${{ inputs.version_label }}-${{ matrix.artifact_name }}
          path: |
            ${{ github.workspace }}/artifacts/typesense-gpu-deps-${{ inputs.version_label }}-linux-${{ matrix.target_arch }}.tar.gz
            ${{ github.workspace }}/artifacts/typesense-gpu-deps-${{ inputs.version_label }}-linux-${{ matrix.target_arch }}.tar.gz.sha256.txt
          retention-days: 14

      - name: Upload lg-page16 GPU deps artifact
        if: matrix.emit_lg_page16_alias && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-gpu-deps-${{ inputs.version_label }}-linux-arm64-lg-page16
          path: |
            ${{ github.workspace }}/artifacts/typesense-gpu-deps-${{ inputs.version_label }}-linux-arm64-lg-page16.tar.gz
            ${{ github.workspace }}/artifacts/typesense-gpu-deps-${{ inputs.version_label }}-linux-arm64-lg-page16.tar.gz.sha256.txt
          retention-days: 14

      - name: Upload primary GPU deps packages
        if: inputs.build_linux_packages && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-gpu-deps-${{ inputs.version_label }}-${{ matrix.artifact_name }}-packages
          path: |
            ${{ github.workspace }}/artifacts/packages/typesense-gpu-deps-${{ inputs.version_label }}-${{ matrix.target_arch }}.deb
            ${{ github.workspace }}/artifacts/packages/typesense-gpu-deps-${{ inputs.version_label }}-1.${{ matrix.rpm_arch }}.rpm
          retention-days: 14

      - name: Upload lg-page16 GPU deps packages
        if: matrix.emit_lg_page16_alias && inputs.build_linux_packages && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-gpu-deps-${{ inputs.version_label }}-linux-arm64-lg-page16-packages
          path: |
            ${{ github.workspace }}/artifacts/packages/typesense-gpu-deps-${{ inputs.version_label }}-arm64-lg-page16.deb
            ${{ github.workspace }}/artifacts/packages/typesense-gpu-deps-${{ inputs.version_label }}-1.lg.page16.aarch64.rpm
          retention-days: 14

      - name: Save Bazel cache
        if: always() && needs.core-binaries.result == 'skipped' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.runner }}-${{ github.workflow }}-docker-${{ matrix.artifact_name }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**', 'docker/ci-bazel-cuda.Dockerfile') }}

      - name: Report Bazel cache size
        if: always() && needs.core-binaries.result == 'skipped'
        run: du -sh ${{ github.workspace }}/.cache/bazel-docker/* 2>/dev/null || true

  docker-images:
    if: >
      always() &&
      inputs.push_docker_images &&
      inputs.upload_artifacts &&
      needs.core-binaries.result == 'success' &&
      (inputs.target_scope == 'all' || inputs.target_scope == 'linux')
    needs:
      - core-binaries
    name: docker-images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: typesense-server-${{ inputs.version_label }}-linux-amd64
          path: ${{ github.workspace }}/docker-release/linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: typesense-server-${{ inputs.version_label }}-linux-arm64
          path: ${{ github.workspace }}/docker-release/linux-arm64

      - name: Download linux-arm64-lg-page16 artifact
        if: inputs.target_scope == 'all' || inputs.target_scope == 'linux'
        uses: actions/download-artifact@v8
        with:
          name: typesense-server-${{ inputs.version_label }}-linux-arm64-lg-page16
          path: ${{ github.workspace }}/docker-release/linux-arm64-lg-page16

      - name: Prepare Docker image contexts
        id: prep
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          echo "SHORT_SHA=${SHORT_SHA}" >>"$GITHUB_ENV"
          echo "BRANCH_TAG=${BRANCH_TAG}" >>"$GITHUB_ENV"

          mkdir -p \
            "${{ github.workspace }}/docker-context/linux-amd64" \
            "${{ github.workspace }}/docker-context/linux-arm64" \
            "${{ github.workspace }}/docker-context/linux-arm64-lg-page16"

          tar -xzf "${{ github.workspace }}/docker-release/linux-amd64/typesense-server-${VERSION_LABEL}-linux-amd64.tar.gz" \
            -C "${{ github.workspace }}/docker-context/linux-amd64"
          tar -xzf "${{ github.workspace }}/docker-release/linux-arm64/typesense-server-${VERSION_LABEL}-linux-arm64.tar.gz" \
            -C "${{ github.workspace }}/docker-context/linux-arm64"

          if [ -f "${{ github.workspace }}/docker-release/linux-arm64-lg-page16/typesense-server-${VERSION_LABEL}-linux-arm64-lg-page16.tar.gz" ]; then
            tar -xzf "${{ github.workspace }}/docker-release/linux-arm64-lg-page16/typesense-server-${VERSION_LABEL}-linux-arm64-lg-page16.tar.gz" \
              -C "${{ github.workspace }}/docker-context/linux-arm64-lg-page16"
            echo "has_lg_page16=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_lg_page16=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push linux-amd64 image
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/docker-context/linux-amd64
          file: ${{ github.workspace }}/docker/deployment.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/typesense:${{ env.BRANCH_TAG }}-${{ env.SHORT_SHA }}-linux-amd64

      - name: Build and push linux-arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/docker-context/linux-arm64
          file: ${{ github.workspace }}/docker/deployment.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/typesense:${{ env.BRANCH_TAG }}-${{ env.SHORT_SHA }}-linux-arm64

      - name: Publish multi-arch runtime tags
        run: |
          docker buildx imagetools create \
            -t "${{ vars.DOCKERHUB_USERNAME }}/typesense:${BRANCH_TAG}-${SHORT_SHA}" \
            -t "${{ vars.DOCKERHUB_USERNAME }}/typesense:${BRANCH_TAG}" \
            "${{ vars.DOCKERHUB_USERNAME }}/typesense:${BRANCH_TAG}-${SHORT_SHA}-linux-amd64" \
            "${{ vars.DOCKERHUB_USERNAME }}/typesense:${BRANCH_TAG}-${SHORT_SHA}-linux-arm64"

      - name: Build and push linux-arm64-lg-page16 image
        if: steps.prep.outputs.has_lg_page16 == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/docker-context/linux-arm64-lg-page16
          file: ${{ github.workspace }}/docker/deployment.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/typesense:${{ env.BRANCH_TAG }}-${{ env.SHORT_SHA }}-arm64-lg-page16
            ${{ vars.DOCKERHUB_USERNAME }}/typesense:${{ env.BRANCH_TAG }}-arm64-lg-page16

# Notes:
# - This is the single manual workflow entrypoint for release artifact builds.
# - Core server artifacts and optional Linux GPU deps stay separate jobs and separate artifact classes, but one dispatch can build the full release set.
# - When `push_docker_images=true` and Docker Hub credentials are configured, the workflow can also publish Linux runtime images from the already-built release artifacts without rebuilding Typesense.
# - It follows GitHub Actions best practices for native multi-platform builds: matrix fan-out, named artifacts, and separation of artifact build from any future publishing workflow.
# - Linux server lanes build the regular typesense-server artifact with CUDA-aware ONNX Runtime support, and the Linux-only gpu-deps job packages the optional ORT provider sidecars from the same repo-owned toolchain.
# - Linux release tarballs/packages now ship the stripped runtime binary plus a separate `.debug` tarball sidecar that keeps split debug info keyed by the same BuildID.
# - Linux lanes now use `scripts/release_linux_artifacts.sh` so local replay and workflow assembly stay container-backed and share one canonical artifact path.
# - Darwin lanes intentionally ship the current unstripped `typesense-server` tarball with embedded DWARF and no `.dSYM` sidecar; revisit only when there is a concrete size/symbolication need plus a macOS-native validation lane.
# - Windows support in upstream docs is via WSL, not a native Windows server binary, so no native Windows artifact is produced here.
