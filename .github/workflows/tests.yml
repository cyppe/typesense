name: tests

on:
  push:
  workflow_dispatch:

# Cancel previous running if a new push is made
# Source: https://stackoverflow.com/a/72408109/123545
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TYPESENSE_BAZEL_IMAGE: typesense/ci-bazel:ci
      TYPESENSE_BAZEL_CACHE_DIR: ${{ github.workspace }}/.cache/bazel-docker
      TYPESENSE_BAZEL_REPO_ENV_CONLYOPTS: -std=gnu17

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**', 'docker/ci-bazel.Dockerfile') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ github.workflow }}-

      - name: Compute ORT bundle key
        id: ort-bundle-key
        run: echo "bundle_key=$(scripts/release_ort_bundle.sh --print-key --target-arch amd64)" >>"${GITHUB_OUTPUT}"

      - name: Find matching prebuilt ORT bundle
        id: ort-bundle-run
        run: |
          set -euo pipefail

          artifact_name="typesense-ort-bundle-${{ steps.ort-bundle-key.outputs.bundle_key }}-linux-amd64"
          run_id=""

          while IFS= read -r candidate_run_id; do
            [ -n "${candidate_run_id}" ] || continue
            found_name="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs/${candidate_run_id}/artifacts" \
              -q '.artifacts[] | select(.name == "'"${artifact_name}"'") | .name' | head -n 1 || true)"
            if [ "${found_name}" = "${artifact_name}" ]; then
              run_id="${candidate_run_id}"
              break
            fi
          done < <(
            gh api -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/ort-bundles.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=20" \
              -q '.workflow_runs[] | select(.conclusion == "success") | .id'
          )

          if [ -n "${run_id}" ]; then
            echo "run_id=${run_id}" >>"$GITHUB_OUTPUT"
            echo "artifact_name=${artifact_name}" >>"$GITHUB_OUTPUT"
            echo "Found matching ORT bundle run ${run_id} for ${artifact_name}"
          else
            echo "run_id=" >>"$GITHUB_OUTPUT"
            echo "artifact_name=${artifact_name}" >>"$GITHUB_OUTPUT"
            echo "No matching ORT bundle found for ${artifact_name}; falling back to source build."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download prebuilt ORT bundle
        if: steps.ort-bundle-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.ort-bundle-run.outputs.artifact_name }}
          path: ${{ github.workspace }}/ort-bundle/amd64
          repository: ${{ github.repository }}
          run-id: ${{ steps.ort-bundle-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract prebuilt ORT bundle
        if: steps.ort-bundle-run.outputs.run_id != ''
        run: |
          cd "${{ github.workspace }}/ort-bundle/amd64"
          sha256sum -c "${{ steps.ort-bundle-run.outputs.artifact_name }}.tar.gz.sha256.txt"
          mkdir -p bundle
          tar -xzf "${{ steps.ort-bundle-run.outputs.artifact_name }}.tar.gz" -C bundle

      - name: Build CI Bazel image
        run: scripts/bazel_in_docker.sh --build-image-only

      - name: Build Typesense
        run: |
          args=(build //:typesense-server)
          if [ -d "${{ github.workspace }}/ort-bundle/amd64/bundle/lib" ]; then
            args+=(--repo_env=TYPESENSE_ORT_PREBUILT_BUNDLE_DIR=/work/ort-bundle/amd64/bundle)
          fi
          scripts/bazel_in_docker.sh "${args[@]}"

      - name: Guard GCC warning budget
        run: |
          TYPESENSE_GCC_WARNING_LOG=${{ github.workspace }}/tmp/gcc-warning-guardrail.log \
          TYPESENSE_GCC_WARNING_MAX=0 \
          TYPESENSE_GCC_TRACKED_WARNING_MAX=0 \
          scripts/check_gcc_warning_guardrail.sh

      - name: Save GCC warning log on failure
        uses: actions/upload-artifact@v7
        with:
          name: gcc-warning-guardrail-log
          path: ${{ github.workspace }}/tmp/gcc-warning-guardrail.log
          if-no-files-found: warn
        if: failure()

      - name: Guard clang warning budget
        run: |
          TYPESENSE_CLANG_WARNING_LOG=${{ github.workspace }}/tmp/clang-warning-guardrail.log \
          TYPESENSE_CLANG_WARNING_MAX=0 \
          TYPESENSE_CLANG_TRACKED_WARNING_MAX=0 \
          TYPESENSE_CLANG_SPARSEPP_WARNING_MAX=0 \
          scripts/check_clang_warning_guardrail.sh

      - name: Save clang warning log on failure
        uses: actions/upload-artifact@v7
        with:
          name: clang-warning-guardrail-log
          path: ${{ github.workspace }}/tmp/clang-warning-guardrail.log
          if-no-files-found: warn
        if: failure()

      - name: Setup artifacts for tests
        run: curl https://dl.typesense.org/ci/tyrec/tyrec-1-models.tar.gz > ./test/resources/models.tar.gz

      - name: Prewarm public embedding test model cache
        run: bash test/scripts/prewarm_public_test_models.sh "${{ github.workspace }}/tmp/ci-models"

      - name: Run tests
        run: |
          args=(test --cache_test_results=no --test_output=all //:typesense-test --test_timeout=1200 --flaky_test_attempts=2 --test_env=TYPESENSE_TEST_MODELS_DIR=/work/tmp/ci-models)
          if [ -d "${{ github.workspace }}/ort-bundle/amd64/bundle/lib" ]; then
            args+=(--repo_env=TYPESENSE_ORT_PREBUILT_BUNDLE_DIR=/work/ort-bundle/amd64/bundle)
          fi
          scripts/bazel_in_docker.sh "${args[@]}"

      # Source: https://github.com/actions/upload-artifact/issues/92#issuecomment-1080347032
      - name: Set BAZEL_BIN_FULL_PATH
        run: echo "BAZEL_BIN_FULL_PATH=$(readlink -f bazel-bin)" >> $GITHUB_ENV

      - name: Set BAZEL_TESTLOGS_FULL_PATH
        run: echo "BAZEL_TESTLOGS_FULL_PATH=$(readlink -f bazel-testlogs)" >> $GITHUB_ENV
        if: failure()

      - name: Verify self-contained typesense-server
        run: |
          if ldd bazel-bin/typesense-server | grep -q 'libonnxruntime\.so\.1'; then
            echo "typesense-server unexpectedly depends on libonnxruntime.so.1" >&2
            exit 1
          fi

      - name: Prepare Typesense runtime bundle
        run: bash api_tests/scripts/prepare_runtime_bundle.sh "${{ github.workspace }}/typesense-runtime-bundle"

      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typesense-server
          path: |
            ${{ github.workspace }}/typesense-runtime-bundle/typesense-server

      - name: Save test logs on failure
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: ${{ env.BAZEL_TESTLOGS_FULL_PATH }}/
        if: failure()

      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/bazel-docker/disk-cache
            ${{ github.workspace }}/.cache/bazel-docker/repository-cache
            ${{ github.workspace }}/.cache/bazel-docker/bazelisk
          key: bazel-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('MODULE.bazel', 'BUILD', '.bazelrc', 'bazel/**', 'docker/ci-bazel.Dockerfile') }}

      - name: Report Bazel cache size
        if: always()
        run: du -sh ${{ github.workspace }}/.cache/bazel-docker/*/ 2>/dev/null || true

  api-tests:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Typesense Binary
        uses: actions/download-artifact@v8
        with:
          name: typesense-server
          path: ./typesense-server-binary

      - name: Get previous successful run
        id: get-previous-run
        run: |
          # First determine if we're on a fork
          REPO_INFO=$(gh api /repos/${{ github.repository }})
          IS_FORK=$(echo "$REPO_INFO" | jq -r '.fork')
          PARENT_REPO=$(echo "$REPO_INFO" | jq -r '.parent.full_name // empty')
          DEFAULT_BRANCH=$(echo "$REPO_INFO" | jq -r '.default_branch')

          echo "Is fork: $IS_FORK"
          if [ "$IS_FORK" = "true" ]; then
            echo "This is a fork of $PARENT_REPO"
            # For forks, get successful runs from the current repo
            REPO_TO_CHECK="${{ github.repository }}"
          else
            echo "This is the main repo"
            # For main repo, get successful runs from main branch
            REPO_TO_CHECK="${{ github.repository }}"
            BRANCH_FILTER="and .head_branch == \"$DEFAULT_BRANCH\""
          fi

          echo "Fetching workflow runs from $REPO_TO_CHECK..."
          if [ "$IS_FORK" = "true" ]; then
            RUNS_INFO=$(gh api -H "Accept: application/vnd.github+json" \
              /repos/$REPO_TO_CHECK/actions/workflows/tests.yml/runs \
              -q '.workflow_runs[] | select(.conclusion == "success") | {id: .id, sha: .head_sha, branch: .head_branch, conclusion: .conclusion}' \
              --paginate | head -n 1)
          else
            RUNS_INFO=$(gh api -H "Accept: application/vnd.github+json" \
              /repos/$REPO_TO_CHECK/actions/workflows/tests.yml/runs \
              -q ".workflow_runs[] | select(.conclusion == \"success\" and .head_branch == \"$DEFAULT_BRANCH\") | {id: .id, sha: .head_sha, branch: .head_branch, conclusion: .conclusion}" \
              --paginate | head -n 1)
          fi

          echo "Found runs info:"
          echo "$RUNS_INFO"

          if [ -z "$RUNS_INFO" ]; then
            echo "No successful runs found"
            echo "previous_run_id=" >> $GITHUB_OUTPUT
          else
            # Extract the latest run info
            LATEST_RUN=$(echo "$RUNS_INFO" | head -n 1)
            LATEST_ID=$(echo "$LATEST_RUN" | jq -r '.id')
            echo "Latest successful run ID: $LATEST_ID"
            echo "previous_run_id=$LATEST_ID" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check previous run TEI cache availability
        if: steps.get-previous-run.outputs.previous_run_id != ''
        id: previous_cache_artifact
        run: |
          ARTIFACT_ID=$(gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/runs/${{ steps.get-previous-run.outputs.previous_run_id }}/artifacts \
            -q '.artifacts[] | select(.name == "tei-model-cache") | .id' | head -n 1)
          if [ -n "$ARTIFACT_ID" ]; then
            echo "has_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download cached model (if exists)
        if: steps.get-previous-run.outputs.previous_run_id != '' && steps.previous_cache_artifact.outputs.has_cache == 'true'
        id: download_cached_model
        uses: actions/download-artifact@v8
        with:
          name: tei-model-cache
          path: ./hf_cache
          github-token: ${{ github.token }}
          run-id: ${{ steps.get-previous-run.outputs.previous_run_id }}
        continue-on-error: true

      - name: Note cache miss (no previous run)
        if: steps.get-previous-run.outputs.previous_run_id == ''
        run: echo "No previous successful run available for TEI cache; proceeding with fresh model download."

      - name: Note cache miss (artifact unavailable)
        if: steps.get-previous-run.outputs.previous_run_id != '' && steps.previous_cache_artifact.outputs.has_cache != 'true'
        run: echo "Previous run found, but TEI cache artifact was unavailable; proceeding with fresh model download."

      - name: Check cache contents
        run: |
          # Check what we actually downloaded
          echo "Contents of hf_cache directory:"
          ls -la ./hf_cache/ || echo "hf_cache directory is empty or doesn't exist"

          # Create empty cache directory if none exists
          if [ ! -d "./hf_cache" ]; then
            echo "No cached model found, will download fresh"
            mkdir -p ./hf_cache
          fi

      - name: Make binary executable
        run: chmod +x ./typesense-server-binary/typesense-server

      - name: Verify runtime library resolution
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/typesense-server-binary/lib
        run: ldd ./typesense-server-binary/typesense-server | tee ./typesense-server-binary/ldd.txt

      - name: Start TEI Container
        run: |
          docker run -d --name tei-container --runtime=runc -p 8080:80 \
            -v ${{ github.workspace }}/hf_cache:/data \
            ghcr.io/huggingface/text-embeddings-inference:cpu-latest \
            --model-id sentence-transformers/all-MiniLM-L6-v2

      - name: Wait for TEI Container to be ready
        run: |
          echo "Waiting for TEI Container to be ready..."
          timeout 600 bash -c 'until curl -s http://localhost:8080/health > /dev/null; do sleep 5; done'
          echo "TEI Container is ready!"

      - name: Print TEI Container logs on failure
        if: failure()
        run: docker logs tei-container || echo "No logs found"

      - name: Detect all secret-gated API env availability
        id: embedding_secrets
        env:
          OPEN_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_URL: ${{ secrets.AZURE_OPENAI_URL }}
        run: |
          if [ -n "${OPEN_AI_API_KEY}" ] && [ -n "${AZURE_OPENAI_API_KEY}" ] && [ -n "${AZURE_OPENAI_URL}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run secret-gated API tests (all 3 vars required)
        if: steps.embedding_secrets.outputs.has_secrets == 'true'
        env:
          TYPESENSE_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/typesense-server-binary
          OPEN_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_URL: ${{ secrets.AZURE_OPENAI_URL }}
        run: scripts/run_api_tests.sh --
        # NOTE: --download-migration-binary removed because NuRaft server
        # cannot load braft-era state directories from the v29 binary.
        # Migration replay is tracked as a known blocked item in MODERNIZATION_PLAN.md.

      - name: Run API tests without secrets
        if: steps.embedding_secrets.outputs.has_secrets != 'true'
        env:
          TYPESENSE_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/typesense-server-binary
          OPEN_AI_API_KEY: ""
        run: scripts/run_api_tests.sh -- --no-secrets

      - name: Run TEI integration lane
        env:
          TYPESENSE_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/typesense-server-binary
          TYPESENSE_TEST_TEI_URL: http://localhost:8080
        run: scripts/run_api_tests.sh -- --no-secrets tests/tei-integration.test.ts

      - name: Upload model cache for next run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tei-model-cache
          path: ./hf_cache
          if-no-files-found: warn
          overwrite: false
          retention-days: 7

      - name: Capture TEI container logs
        if: always()
        run: docker logs tei-container > ./tei-container.log 2>&1 || echo "No logs found" > ./tei-container.log

      - name: Upload API diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-diagnostics
          path: |
            ./tei-container.log
            ./typesense-server-binary/ldd.txt
            ./tmp/test
            ./api_tests/artifacts
          if-no-files-found: warn

      - name: Cleanup TEI Container
        if: always()
        run: |
          docker stop tei-container || true
          docker rm tei-container || true
