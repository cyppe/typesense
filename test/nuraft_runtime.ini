[server]
data-dir = /tmp/nuraft-runtime
api-key = xyz
enable-cors = true
max-group-limit = 2500
healthy-read-lag = 1500
cache-num-entries = 2048
api-address = 0.0.0.0
api-port = 7108
peering-port = 7107
nodes = 127.0.0.1:7107:7108,127.0.0.2:7107:7108
node-host = file-node
api-uses-ssl = false
raft-heart-beat-interval-ms = 250
raft-auto-forwarding = true
